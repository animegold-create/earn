<!DOCTYPE html>
<html>
<head>
  <title>Welcome to AnimeGold</title>
  <style>
    body { font-family: Arial, sans-serif; background:#111; color:#fff; text-align:center; }
    button { margin:10px; padding:10px 20px; border-radius:5px; background:#ff9800; border:none; cursor:pointer; }
  </style>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut } 
      from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
    import { getFirestore, doc, setDoc } 
      from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB6qQybRVw4nlwGA-Kp8d6kCqOhdqo11Aw",
      authDomain: "animegold-bf2a7.firebaseapp.com",
      projectId: "animegold-bf2a7",
      storageBucket: "animegold-bf2a7.firebasestorage.app",
      messagingSenderId: "1055086176557",
      appId: "1:1055086176557:web:57eace7825d9e7a069cba4",
      measurementId: "G-0QNF3XR7XH"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    // Login
    window.login = function() {
      signInWithRedirect(auth, provider);
    }

    // Logout
    window.logout = function() {
      signOut(auth).then(() => {
        document.getElementById("status").innerText = "Not logged in.";
        document.getElementById("earnBtn").style.display = "none";
      });
    }

    // Handle redirect result
    getRedirectResult(auth)
      .then(async (result) => {
        if (result && result.user) {
          const u = result.user;
          const userRef = doc(db, "users", u.uid);

          await setDoc(userRef, {
            displayName: u.displayName,
            email: u.email,
            minuteCounter: 0,
            pendingEarnings: 0,
            totalEarnings: 0
          }, { merge: true });

          document.getElementById("status").innerText =
            "Logged in as: " + u.displayName + " (" + u.email + ")";
          document.getElementById("earnBtn").style.display = "inline-block";
        }
      })
      .catch((error) => {
        console.error("Login error:", error);
        alert("Login error: " + error.message);
      });

    // Keep session updated
    onAuthStateChanged(auth, (u) => {
      if (u) {
        document.getElementById("status").innerText =
          "Logged in as: " + u.displayName + " (" + u.email + ")";
        document.getElementById("earnBtn").style.display = "inline-block";
      } else {
        document.getElementById("earnBtn").style.display = "none";
      }
    });
  </script>
</head>
<body>
  <h1>Welcome to AnimeGold</h1>
  <p id="status">Not logged in.</p>
  <button onclick="login()">Login with Google</button>
  <button onclick="logout()">Logout</button>
  <br><br>
  <!-- Earn button only shows when logged in -->
  <button id="earnBtn" style="display:none;" onclick="window.location.href='earn.html'">Go to Earn Page</button>
</body>
</html>
