<!DOCTYPE html>
<html>
<head>
  <title>AnimeGold - Login</title>
  <style>
    body { background:#111; color:#fff; text-align:center; font-family:Arial; }
    .section { margin:20px; padding:20px; border-radius:10px; background:#222; }
    button { margin:10px; padding:10px 20px; background:#ff9800; border:none; border-radius:5px; cursor:pointer; }
  </style>
</head>
<body>
  <div class="section">
    <h1>Welcome to AnimeGold</h1>
    <p>Sign in with your Gmail account</p>
    <button onclick="loginWithGoogle()">Login with Gmail</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB6qQybRVw4nlwGA-Kp8d6kCqOhdqo11Aw",
      authDomain: "animegold-bf2a7.firebaseapp.com",
      projectId: "animegold-bf2a7",
      storageBucket: "animegold-bf2a7.firebasestorage.app",
      messagingSenderId: "1055086176557",
      appId: "1:1055086176557:web:aca8f68412e95ef369cba4",
      measurementId: "G-J9LX9WMPJK"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    window.loginWithGoogle = () => {
      signInWithPopup(auth, provider)
        .then((result) => {
          alert("Login successful!");
          // After first login, send them to setupname.html to set display name
          window.location.href = "setupname.html";
        })
        .catch((err) => alert("Error: " + err.message));
    };

    onAuthStateChanged(auth, (user) => {
      if (user) {
        // If already logged in, go straight to earn page
        window.location.href = "earn.html";
      }
    });
  </script>
</body>
</html>
