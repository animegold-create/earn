<!DOCTYPE html>
<html>
<head>
  <title>Welcome to AnimeGold</title>
  <style>
    body { font-family: Arial, sans-serif; background:#111; color:#fff; text-align:center; }
    button { margin:10px; padding:10px 20px; border-radius:5px; background:#ff9800; border:none; cursor:pointer; }
  </style>
  <script type="module">
    // Import Firebase SDKs
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-analytics.js";
    import { getAuth, GoogleAuthProvider, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut } 
      from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
    import { getFirestore, doc, setDoc } 
      from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyB6qQybRVw4nlwGA-Kp8d6kCqOhdqo11Aw",
      authDomain: "animegold-bf2a7.firebaseapp.com",
      projectId: "animegold-bf2a7",
      storageBucket: "animegold-bf2a7.firebasestorage.app",
      messagingSenderId: "1055086176557",
      appId: "1:1055086176557:web:aca8f68412e95ef369cba4",
      measurementId: "G-J9LX9WMPJK"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    // Login
    window.login = () => signInWithRedirect(auth, provider);

    // Logout
    window.logout = () => signOut(auth).then(() => {
      document.getElementById("status").innerText = "Not logged in.";
    });

    // Handle login redirect
    getRedirectResult(auth).then(async (result) => {
      if (result && result.user) {
        const u = result.user;
        const userRef = doc(db, "users", u.uid);

        await setDoc(userRef, {
          displayName: u.displayName,
          email: u.email,
          minuteCounter: 0,
          pendingEarnings: 0,
          totalEarnings: 0
        }, { merge: true });

        // ✅ Direct redirect to earn.html
        window.location.href = "earn.html";
      }
    }).catch(err => alert("Login error: " + err.message));

    // If already logged in, go straight to earn.html
    onAuthStateChanged(auth, (u) => {
      if (u) window.location.href = "earn.html";
    });
  </script>
</head>
<body>
  <h1>Welcome to AnimeGold</h1>
  <p id="status">Not logged in.</p>
  <button onclick="login()">Login with Google</button>
  <button onclick="logout()">Logout</button>
</body>
</html>
