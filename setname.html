<!DOCTYPE html>
<html>
<head>
  <title>Set Name</title>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB6qQybRVw4nlwGA-Kp8d6kCqOhdqo11Aw",
      authDomain: "animegold-bf2a7.firebaseapp.com",
      projectId: "animegold-bf2a7",
      storageBucket: "animegold-bf2a7.firebasestorage.app",
      messagingSenderId: "1055086176557",
      appId: "1:1055086176557:web:57eace7825d9e7a069cba4",
      measurementId: "G-0QNF3XR7XH"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let userRef;

    onAuthStateChanged(auth, (u) => {
      if (u) {
        userRef = doc(db, "users", u.uid);
      } else {
        window.location.href = "index.html";
      }
    });

    window.saveName = async function() {
      if (!userRef) {
        alert("Not connected yet.");
        return;
      }

      const nameInput = document.getElementById("name").value.trim();
      if (!nameInput) {
        alert("Please enter a name.");
        return;
      }

      try {
        await setDoc(userRef, { displayName: nameInput, minuteCounter: 0 }, { merge: true });
        alert("Saved!");
        window.location.href = "earn.html";
      } catch (err) {
        console.error("Save failed:", err);
        alert("Error saving name: " + err.message);
      }
    }
  </script>
</head>
<body>
  <h1>Set Name</h1>
  <input type="text" id="name" placeholder="Enter unique name">
  <button onclick="saveName()">Save Name</button>
</body>
</html>
