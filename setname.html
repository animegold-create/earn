<input id="name" placeholder="Enter name">
<button onclick="saveName()">Save</button>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
  import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

  const app = initializeApp({ /* your config */ });
  const auth = getAuth(app);
  const db = getFirestore(app);

  let userRef;
  onAuthStateChanged(auth, u => { if (u) userRef = doc(db,"users",u.uid); });

  window.saveName = async () => {
    const name = document.getElementById("name").value.trim();
    await setDoc(userRef, { displayName: name, minuteCounter: 0 }, { merge:true });
    window.location.href = "earn.html";
  }
</script>
