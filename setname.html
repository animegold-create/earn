<script type="module">
  // 👉 Paste your firebaseConfig here
  const firebaseConfig = {
    apiKey: "AIzaSyB6qQybRVw4nlwGA-Kp8d6kCqOhdqo11Aw",
    authDomain: "animegold-bf2a7.firebaseapp.com",
    projectId: "animegold-bf2a7",
    storageBucket: "animegold-bf2a7.firebasestorage.app",
    messagingSenderId: "1055086176557",
    appId: "1:1055086176557:web:3e8f6fdd9778bd7169cba4",
    measurementId: "G-QLVB68T2XM"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let userRef;

  onAuthStateChanged(auth, (u) => {
    if (u) {
      userRef = doc(db, "users", u.uid);
    } else {
      window.location.href = "index.html";
    }
  });

  // 👉 Your saveName function goes right after this
  window.saveName = async function() {
    if (!userRef) {
      alert("Not connected yet.");
      return;
    }

    const nameInput = document.getElementById("name").value.trim();
    if (!nameInput) {
      alert("Please enter a name.");
      return;
    }

    try {
      await setDoc(userRef, { displayName: nameInput }, { merge: true });
      alert("Saved!");
      window.location.href = "earn.html";
    } catch (err) {
      console.error("Save failed:", err);
      alert("Error saving name: " + err.message);
    }
  }
</script>
