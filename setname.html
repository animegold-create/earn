<!DOCTYPE html>
<html>
<head>
  <title>Set Display Name</title>
  <style>
    body { font-family: Arial, sans-serif; background:#111; color:#fff; text-align:center; }
    .section { margin:20px; padding:20px; border-radius:10px; background:#222; }
    input, button { margin:10px; padding:8px; border-radius:5px; }
    button { background:#ff9800; border:none; cursor:pointer; }
  </style>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, collection, query, where, getDocs } 
      from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB6qQybRVw4nlwGA-Kp8d6kCqOhdqo11Aw",
      authDomain: "animegold-bf2a7.firebaseapp.com",
      projectId: "animegold-bf2a7",
      storageBucket: "animegold-bf2a7.firebasestorage.app",
      messagingSenderId: "1055086176557",
      appId: "1:1055086176557:web:57eace7825d9e7a069cba4",
      measurementId: "G-0QNF3XR7XH"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let userRef;

    onAuthStateChanged(auth, (u) => {
      if (u) {
        userRef = doc(db, "users", u.uid);
      } else {
        window.location.href = "index.html";
      }
    });

    window.saveDisplayName = async function() {
      const name = document.getElementById("nameInput").value.trim();
      if (!name) {
        alert("Please enter a name.");
        return;
      }

      // Reserved names
      const reserved = ["admin", "staff", "system"];
      if (reserved.includes(name.toLowerCase())) {
        alert("That name is reserved. Please choose another.");
        return;
      }

      // Check uniqueness
      const q = query(collection(db, "users"), where("displayName", "==", name));
      const snap = await getDocs(q);

      if (!snap.empty) {
        alert("That name is already taken. Please choose another.");
        return;
      }

      // Save if unique
      await setDoc(userRef, { displayName: name }, { merge: true });
      alert("Name saved successfully!");
      window.location.href = "earn.html";
    }
  </script>
</head>
<body>
  <h1>Set Your Display Name</h1>
  <div class="section">
    <input type="text" id="nameInput" placeholder="Enter display name" style="width:250px;"><br>
    <button onclick="saveDisplayName()">Save Name</button>
  </div>
</body>
</html>
