<!DOCTYPE html>
<html>
<head>
  <title>Set Your Name</title>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-analytics.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB6qQybRVw4nlwGA-Kp8d6kCqOhdqo11Aw",
      authDomain: "animegold-bf2a7.firebaseapp.com",
      projectId: "animegold-bf2a7",
      storageBucket: "animegold-bf2a7.firebasestorage.app",
      messagingSenderId: "1055086176557",
      appId: "1:1055086176557:web:3e8f6fdd9778bd7169cba4",
      measurementId: "G-QLVB68T2XM"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;

    // Wait until Firebase confirms the user is logged in
    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        document.getElementById("status").innerText = "Logged in as " + user.email;
      } else {
        window.location.href = "index.html";
      }
    });

    async function saveName() {
      const name = document.getElementById("username").value.trim();
      if (!name) {
        alert("Please enter a name.");
        return;
      }
      if (currentUser) {
        try {
          await setDoc(doc(db, "users", currentUser.uid), { displayName: name }, { merge: true });
          alert("Name saved successfully!");
          window.location.href = "earn.html";
        } catch (error) {
          console.error("Error saving name:", error);
          alert("Failed to save name. Check Firestore rules.");
        }
      } else {
        alert("User not logged in yet. Please wait a moment.");
      }
    }

    window.saveName = saveName;
  </script>
</head>
<body style="background:#111;color:#fff;text-align:center;">
  <h1>Set Your Display Name</h1>
  <p id="status">Checking login...</p>
  <input type="text" id="username" placeholder="Enter your name">
  <button onclick="saveName()">Save</button>
</body>
</html>
