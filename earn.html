<h1 id="greeting"></h1>
<p id="points"></p>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

  const app = initializeApp({ /* your config */ });
  const auth = getAuth(app);
  const db = getFirestore(app);

  onAuthStateChanged(auth, async u => {
    if (!u) return;
    const snap = await getDoc(doc(db,"users",u.uid));
    if (snap.exists()) {
      const data = snap.data();
      if (data.displayName) {
        document.getElementById("greeting").innerText = "Hello, " + data.displayName;
        document.getElementById("points").innerText = (data.minuteCounter/60).toFixed(2) + " points";
      } else {
        window.location.href = "setname.html";
      }
    }
  });
</script>
