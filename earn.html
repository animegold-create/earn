<!DOCTYPE html>
<html>
<head>
  <title>Earn Points - AnimeGold</title>
  <style>
    body { font-family: Arial, sans-serif; background:#111; color:#fff; text-align:center; margin:0; padding:0; }
    .section { margin:20px; padding:20px; border-radius:10px; background:#222; }
    .eligibility { display:flex; justify-content:center; gap:20px; flex-wrap:wrap; margin-top:20px; }
    .card { background:#333; padding:15px; border-radius:8px; width:180px; }
    .card h3 { margin:0 0 10px; font-size:16px; }
    .card button { background:#ff9800; border:none; padding:8px 12px; border-radius:5px; cursor:pointer; }
    .banned-message { background:#c0392b; padding:20px; border-radius:10px; margin:20px; }
    .status-badge { display:inline-block; padding:5px 10px; border-radius:5px; font-weight:bold; margin:10px 0; }
    .status-active { background:#27ae60; }
    .status-inactive { background:#95a5a6; }
    
    /* Notifications Banner */
    .notifications-container { position:fixed; top:0; left:0; right:0; width:100%; z-index:1000; padding:0; margin:0; }
    .notification { background:linear-gradient(135deg, #ff9800, #f39c12); padding:20px 40px; width:100%; box-sizing:border-box; animation:slideInDown 0.5s ease-out, slideOutUp 0.5s ease-in 4.5s forwards; box-shadow:0 4px 15px rgba(255, 152, 0, 0.6); border-bottom:4px solid #fff; text-align:center; }
    .notification-text { color:#fff; font-weight:bold; font-size:18px; margin:0; }
    @keyframes slideInDown { from { transform:translateY(-100%); opacity:0; } to { transform:translateY(0); opacity:1; } }
    @keyframes slideOutUp { from { transform:translateY(0); opacity:1; } to { transform:translateY(-100%); opacity:0; } }
    
    /* Body adjustment for banner */
    body.notification-active { padding-top:60px; }
    
    /* Spin the Wheel Styles */
    .wheel-container { position:relative; width:300px; height:300px; margin:20px auto; }
    .wheel { width:100%; height:100%; border-radius:50%; position:relative; overflow:hidden; box-shadow:0 0 20px rgba(255, 152, 0, 0.5); }
    .wheel-segment { position:absolute; width:100%; height:100%; clip-path:polygon(50% 50%, 50% 0%, 100% 0%); transform-origin:50% 50%; display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:12px; color:#fff; }
    .pointer { position:absolute; top:-15px; left:50%; transform:translateX(-50%); width:0; height:0; border-left:15px solid transparent; border-right:15px solid transparent; border-top:20px solid #ff9800; z-index:10; }
    .spin-button { background:#27ae60; border:none; padding:12px 30px; border-radius:5px; cursor:pointer; font-size:16px; font-weight:bold; color:#fff; margin:10px; }
    .spin-button:disabled { background:#95a5a6; cursor:not-allowed; }
    .spin-result { background:#333; padding:15px; border-radius:8px; margin:20px auto; width:fit-content; font-size:18px; font-weight:bold; }
    .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); justify-content:center; align-items:center; z-index:999; }
    .modal-content { background:#333; padding:30px; border-radius:10px; text-align:center; width:300px; }
    .modal-content h2 { margin-top:0; }
    .modal-content button { margin:10px 5px; padding:10px 20px; background:#ff9800; border:none; border-radius:5px; cursor:pointer; }
    .modal-content button.close { background:#e74c3c; }
  </style>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB6qQybRVw4nlwGA-Kp8d6kCqOhdqo11Aw",
      authDomain: "animegold-bf2a7.firebaseapp.com",
      projectId: "animegold-bf2a7",
      storageBucket: "animegold-bf2a7.firebasestorage.app",
      messagingSenderId: "1055086176557",
      appId: "1:1055086176557:web:aca8f68412e95ef369cba4",
      measurementId: "G-J9LX9WMPJK"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let userRef, userData = {}, minuteCounter = 0, watching = false, updateInterval;
    let isSpinning = false;
    let currentUserName = "User";

    // Filipino/Bisaya first names for bot claims
    const filipinoNames = [
      'Maria', 'Juan', 'Rosa', 'Miguel', 'Lucia', 'Carlos', 'Ana', 'Pedro',
      'Mariano', 'Corazon', 'Amelia', 'Ernesto', 'Elena', 'Diego', 'Sofia',
      'Ramon', 'Aurora', 'Javier', 'Carmen', 'Fernando', 'Catalina', 'Ruben',
      'Dolores', 'Vicente', 'Manuela', 'Arturo', 'Rosita', 'Sergio', 'Angelina'
    ];

    const rewards = [100, 200, 500, 1000];

    // Wheel configuration - prizes in points (1 point = 1 peso)
    const wheelPrizes = [
      { points: 0.20, chance: 54.9869, color: '#e74c3c' },
      { points: 0.50, chance: 34.9131, color: '#3498db' },
      { points: 0.80, chance: 5, color: '#2ecc71' },
      { points: 1, chance: 0.004, color: '#f39c12' },
      { points: 5, chance: 0.008, color: '#9b59b6' },
      { points: 10, chance: 0.0015, color: '#1abc9c' },
      { points: 25, chance: 0.0004, color: '#34495e' },
      { points: 50, chance: 0.0002, color: '#c0392b' },
      { points: 100, chance: 0.0000001, color: '#f1c40f' }
    ];

    function getRandomName() {
      return filipinoNames[Math.floor(Math.random() * filipinoNames.length)];
    }

    function getRandomReward() {
      return rewards[Math.floor(Math.random() * rewards.length)];
    }

    function showNotification(message) {
      const container = document.getElementById('notificationsContainer');
      const notification = document.createElement('div');
      notification.className = 'notification';
      notification.innerHTML = `<p class="notification-text">${message}</p>`;
      container.appendChild(notification);
      
      document.body.classList.add('notification-active');

      // Auto remove after 5 seconds
      setTimeout(() => {
        notification.remove();
        if (container.children.length === 0) {
          document.body.classList.remove('notification-active');
        }
      }, 5000);
    }

    function createWheel() {
      const wheelDiv = document.getElementById('wheel');
      wheelDiv.innerHTML = '';
      
      const segmentAngle = 360 / wheelPrizes.length;
      wheelPrizes.forEach((prize, index) => {
        const segment = document.createElement('div');
        segment.className = 'wheel-segment';
        segment.style.background = prize.color;
        segment.style.transform = `rotate(${segmentAngle * index}deg)`;
        segment.textContent = prize.points + 'pts';
        wheelDiv.appendChild(segment);
      });
    }

    function getRandomPrize() {
      const random = Math.random() * 100;
      let cumulative = 0;
      
      for (let prize of wheelPrizes) {
        cumulative += prize.chance;
        if (random <= cumulative) {
          return prize;
        }
      }
      
      return wheelPrizes[0];
    }

    // Simulate bot claiming rewards every 10-30 seconds
    function startBotClaims() {
      setInterval(() => {
        const botName = getRandomName();
        const reward = getRandomReward();
        showNotification(`🎉 ${botName} claimed ₱${reward}!`);
      }, Math.random() * 20000 + 10000); // 10-30 seconds
    }

    // Set status to inactive when browser closes or tab closes
    window.addEventListener('beforeunload', async (e) => {
      if (userRef) {
        try {
          await setDoc(userRef, { activityStatus: "inactive" }, { merge: true });
        } catch (err) {
          console.error("Error setting status to inactive:", err);
        }
      }
    });

    // Also handle when tab loses focus (optional - set to away)
    window.addEventListener('blur', async () => {
      if (watching && userRef) {
        try {
          await setDoc(userRef, { activityStatus: "away" }, { merge: true });
        } catch (err) {
          console.error("Error setting status to away:", err);
        }
      }
    });

    // When tab regains focus
    window.addEventListener('focus', async () => {
      if (watching && userRef) {
        try {
          await setDoc(userRef, { activityStatus: "active" }, { merge: true });
        } catch (err) {
          console.error("Error setting status to active:", err);
        }
      }
    });

    window.spinWheel = async () => {
      const pts = minuteCounter / 300;
      
      if (pts < 1) {
        alert("You need at least 1 point to spin!");
        return;
      }

      if (isSpinning) {
        alert("Already spinning...");
        return;
      }

      isSpinning = true;
      document.getElementById('spinBtn').disabled = true;

      try {
        // Deduct 1 point (300 minutes)
        minuteCounter -= 300;
        await setDoc(userRef, { minuteCounter }, { merge: true });

        // Spin animation
        const wheel = document.getElementById('wheel');
        const spins = 10;
        const extraDegrees = Math.floor(Math.random() * 360);
        const totalRotation = spins * 360 + extraDegrees;

        wheel.style.transition = 'transform 3s ease-out';
        wheel.style.transform = `rotate(${totalRotation}deg)`;

        // Wait for spin to complete
        await new Promise(resolve => setTimeout(resolve, 3000));

        // Calculate which prize won
        const winningIndex = Math.floor((360 - (extraDegrees % 360)) / (360 / wheelPrizes.length)) % wheelPrizes.length;
        const prize = wheelPrizes[winningIndex];

        // Add winnings directly to minuteCounter as points
        // Convert points to minutes: points * 300 = minutes
        const pointsToAdd = prize.points * 300;
        minuteCounter += pointsToAdd;

        await setDoc(userRef, { minuteCounter }, { merge: true });

        // Show result
        document.getElementById('resultText').innerText = `🎉 You Won: ${prize.points} points!`;
        document.getElementById('resultModal').style.display = 'flex';

        updateUI();
      } catch (err) {
        alert("Error during spin: " + err.message);
      } finally {
        isSpinning = false;
        document.getElementById('spinBtn').disabled = false;
      }
    };

    window.closeResultModal = () => {
      document.getElementById('resultModal').style.display = 'none';
    };

    onAuthStateChanged(auth, async (u) => {
      if (u) {
        userRef = doc(db, "users", u.uid);
        const snap = await getDoc(userRef);
        if (snap.exists()) userData = snap.data();

        // Store current user name
        currentUserName = userData.userName || "User";

        // 🚫 CHECK IF USER IS BANNED
        if (userData.banned === true) {
          document.body.innerHTML = `
            <div class="banned-message">
              <h1>⛔ Account Banned</h1>
              <p>Your account has been banned and you cannot access this service.</p>
              <p>If you believe this is an error, please contact support.</p>
              <button onclick="logout()" style="background:#ff9800; padding:10px 20px; border:none; border-radius:5px; cursor:pointer;">Logout</button>
            </div>
          `;
          return;
        }

        document.getElementById("greeting").innerText =
          "Hello, " + currentUserName + "!";

        minuteCounter = userData.minuteCounter || 0;
        createWheel();
        updateUI();
        startBotClaims(); // Start bot claims
      } else {
        window.location.href = "index.html";
      }
    });

    window.loadSeries = async () => {
      document.getElementById("seriesFrame").src =
        document.getElementById("seriesSelect").value;
      watching = true;

      // Set user status to ACTIVE
      await setDoc(userRef, { activityStatus: "active", lastActivityTime: new Date().toISOString() }, { merge: true });

      // Update status badge
      document.getElementById("statusBadge").textContent = "🟢 ACTIVE";
      document.getElementById("statusBadge").className = "status-badge status-active";

      // Start counting minutes after clicking Load
      if (updateInterval) clearInterval(updateInterval);
      updateInterval = setInterval(async () => {
        if (watching) {
          minuteCounter++;
          await setDoc(userRef, { minuteCounter, lastActivityTime: new Date().toISOString() }, { merge: true });
          updateUI();
        }
      }, 60000);
    };

    window.stopWatching = async () => {
      watching = false;
      if (updateInterval) clearInterval(updateInterval);

      // Set user status to INACTIVE
      await setDoc(userRef, { activityStatus: "inactive" }, { merge: true });

      // Update status badge
      document.getElementById("statusBadge").textContent = "⚫ INACTIVE";
      document.getElementById("statusBadge").className = "status-badge status-inactive";

      document.getElementById("seriesFrame").src = "";
      alert("Stopped watching. Status set to Inactive.");
    };

    async function updateUI() {
      const snap = await getDoc(userRef);
      if (snap.exists()) userData = snap.data();
      
      const pointsEarned = (minuteCounter / 300).toFixed(4);
      document.getElementById("points").innerText =
        pointsEarned + " points";
      document.getElementById("pending").innerText =
        userData.pendingEarnings || 0;
      document.getElementById("total").innerText =
        userData.totalEarnings || 0;

      // Update status badge
      const status = userData.activityStatus || "inactive";
      if (status === "active") {
        document.getElementById("statusBadge").textContent = "🟢 ACTIVE";
        document.getElementById("statusBadge").className = "status-badge status-active";
      } else {
        document.getElementById("statusBadge").textContent = "⚫ INACTIVE";
        document.getElementById("statusBadge").className = "status-badge status-inactive";
      }
    }

    window.claimReward = async (cost) => {
      const pts = minuteCounter / 300;
      const snap = await getDoc(userRef);
      let data = {};
      if (snap.exists()) data = snap.data();

      if (!data.payoutMethod || !data.payoutNumber || !data.payoutName) {
        alert("Please set up your payout info first!");
        return;
      }

      if (pts >= cost) {
        const newPending = (data.pendingEarnings || 0) + cost;
        minuteCounter -= cost * 300;
        await setDoc(userRef, { minuteCounter, pendingEarnings: newPending }, { merge: true });
        
        // Show user notification with actual name
        const displayName = data.userName || "User";
        showNotification(`🎉 ${displayName} claimed ₱${cost}!`);
        
        alert("₱" + cost + " added to Pending Earnings for " +
              displayName + " via " + data.payoutMethod + "!");
        updateUI();
      } else {
        alert("Not enough points yet!");
      }
    };

    window.logout = () => signOut(auth).then(async () => {
      // Set status to inactive before logout
      if (userRef) {
        await setDoc(userRef, { activityStatus: "inactive" }, { merge: true });
      }
      window.location.href = "index.html";
    });
  </script>
</head>
<body>
  <!-- Notifications Banner - Full Width at Top -->
  <div id="notificationsContainer" class="notifications-container"></div>

  <h1 id="greeting">Loading...</h1>
  <div class="section">
    <div id="statusBadge" class="status-badge status-inactive">⚫ INACTIVE</div>
    <p>Total Points: <span id="points">0.0000 points</span></p>
    <p>Pending Earnings: ₱<span id="pending">0</span></p>
    <p>Total Earnings: ₱<span id="total">0</span></p>
  </div>
  <div class="section">
    <h2>Watch Series</h2>
    <select id="seriesSelect">
      <option value="https://trimz.tv/system-analyzer?ep=1">System Analyzer</option>
      <option value="https://trimz.tv/the-gamer?ep=1">The Gamer</option>
      <option value="https://trimz.tv/99-reinforced-wooden-stick?ep=1">+99 Reinforced Wooden Stick</option>
      <option value="https://trimz.tv/slam-jam?ep=1">Slam Jam</option>
      <option value="https://trimz.tv/guardians-of-rokia?ep=1">Guardians of Rokia</option>
      <option value="https://trimz.tv/lifeexe?ep=1">Life.exe</option>
    </select>
    <div style="margin-top:20px;">
      <iframe id="seriesFrame" width="640" height="360" frameborder="0" allowfullscreen></iframe>
    </div>
    <button onclick="loadSeries()">Load</button>
    <button onclick="stopWatching()" style="background:#e74c3c;">Stop Watching</button>
  </div>
  <div class="section">
    <h2>Spin the Wheel</h2>
    <p style="font-size:14px; color:#ff9800;">Cost: 1 point per spin</p>
    <div class="wheel-container">
      <div class="pointer"></div>
      <div class="wheel" id="wheel"></div>
    </div>
    <button class="spin-button" id="spinBtn" onclick="spinWheel()">🎡 SPIN</button>
  </div>
  <div class="section">
    <h2>Rewards</h2>
    <div class="eligibility">
      <div class="card"><h3>Reward ₱100</h3><p>Cost: 100 points</p><button onclick="claimReward(100)">Claim</button></div>
      <div class="card"><h3>Reward ₱200</h3><p>Cost: 200 points</p><button onclick="claimReward(200)">Claim</button></div>
      <div class="card"><h3>Reward ₱500</h3><p>Cost: 500 points</p><button onclick="claimReward(500)">Claim</button></div>
      <div class="card"><h3>Reward ₱1000</h3><p>Cost: 1000 points</p><button onclick="claimReward(1000)">Claim</button></div>
    </div>
  </div>
  <div class="section">
    <button onclick="window.location.href='payout.html'">Update Payout Info</button>
    <button onclick="logout()">Logout</button>
  </div>

  <!-- Result Modal -->
  <div id="resultModal" class="modal">
    <div class="modal-content">
      <h2>Spin Result!</h2>
      <div id="resultText" style="font-size:24px; margin:20px 0; color:#27ae60;"></div>
      <button onclick="closeResultModal()" class="close">Close</button>
    </div>
  </div>
</body>
</html>
