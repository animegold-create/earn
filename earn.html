<!DOCTYPE html>
<html>
<head>
  <title>Earn Points</title>
  <style>
    body { font-family: Arial, sans-serif; background:#111; color:#fff; text-align:center; }
    .section { margin:20px; padding:20px; border-radius:10px; background:#222; }
    .eligibility { display:flex; justify-content:center; gap:20px; flex-wrap:wrap; margin-top:20px; }
    .card { background:#333; padding:15px; border-radius:8px; width:180px; }
    .card h3 { margin:0 0 10px; font-size:16px; }
    .card button { background:#ff9800; border:none; padding:8px 12px; border-radius:5px; cursor:pointer; }
    .card button:disabled { background:#555; cursor:not-allowed; }
    ul { list-style:none; padding:0; }
    li { margin:5px 0; }
  </style>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB6qQybRVw4nlwGA-Kp8d6kCqOhdqo11Aw",
      authDomain: "animegold-bf2a7.firebaseapp.com",
      projectId: "animegold-bf2a7",
      storageBucket: "animegold-bf2a7.firebasestorage.app",
      messagingSenderId: "1055086176557",
      appId: "1:1055086176557:web:3e8f6fdd9778bd7169cba4"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let minuteCounter = 0;
    let userRef, user;
    let userData = {};

    onAuthStateChanged(auth, async (u) => {
      if (u) {
        user = u;
        userRef = doc(db, "users", user.uid);
        const userDoc = await getDoc(userRef);

        if (userDoc.exists()) {
          userData = userDoc.data();
          document.getElementById("greeting").innerText = "Hello, " + (userData.displayName || "User") + "!";
          minuteCounter = userData.minuteCounter || 0;
        } else {
          window.location.href = "setname.html";
        }

        updateUI();
        loadHistory();

        // Auto tick every minute
        setInterval(async () => {
          minuteCounter++;
          await setDoc(userRef, { minuteCounter }, { merge: true });
          updateUI();
        }, 60000);

        async function claimReward(cost) {
          const calculatedPoints = minuteCounter / 60;
          if (calculatedPoints >= cost) {
            alert("You claimed ₱" + cost + "! It is now pending.");
            minuteCounter -= cost * 60;

            await setDoc(userRef, {
              minuteCounter,
              pendingEarnings: (userData.pendingEarnings || 0) + cost
            }, { merge: true });

            userData.pendingEarnings = (userData.pendingEarnings || 0) + cost;
            updateUI();
            loadHistory();
          }
        }

        document.getElementById("reward100").addEventListener("click", () => claimReward(100));
        document.getElementById("reward200").addEventListener("click", () => claimReward(200));
        document.getElementById("reward500").addEventListener("click", () => claimReward(500));
        document.getElementById("reward1000").addEventListener("click", () => claimReward(1000));

        function updateUI() {
          const calculatedPoints = minuteCounter / 60;
          document.getElementById("points").innerText = calculatedPoints.toFixed(2) + " points";

          document.getElementById("pending").innerText = userData.pendingEarnings || 0;
          document.getElementById("total").innerText = userData.totalEarnings || 0;

          document.getElementById("reward100").disabled = calculatedPoints < 100;
          document.getElementById("reward200").disabled = calculatedPoints < 200;
          document.getElementById("reward500").disabled = calculatedPoints < 500;
          document.getElementById("reward1000").disabled = calculatedPoints < 1000;
        }

        async function loadHistory() {
          const claimsRef = collection(db, "users", user.uid, "claims");
          const snapshot = await getDocs(claimsRef);
          const historyList = document.getElementById("history");
          historyList.innerHTML = "";
          snapshot.forEach(docSnap => {
            const data = docSnap.data();
            const li = document.createElement("li");
            li.textContent = `₱${data.cost} claimed on ${new Date(data.date).toLocaleString()}`;
            historyList.appendChild(li);
          });
        }

        // Admin-only function to mark payment
        window.payUser = async function(amount) {
          await setDoc(userRef, {
            pendingEarnings: (userData.pendingEarnings || 0) - amount,
            totalEarnings: (userData.totalEarnings || 0) + amount
          }, { merge: true });

          userData.pendingEarnings = (userData.pendingEarnings || 0) - amount;
          userData.totalEarnings = (userData.totalEarnings || 0) + amount;
          updateUI();
        }
      } else {
        window.location.href = "index.html";
      }
    });

    window.loadSeries = function() {
      const url = document.getElementById("seriesSelect").value;
      document.getElementById("seriesFrame").src = url;
    }
  </script>
</head>
<body>
  <h1 id="greeting">Loading...</h1>

  <!-- Points + Earnings -->
  <div class="section">
    <p>Total Points: <span id="points">0.00 points</span></p>
    <p>Pending Earnings: ₱<span id="pending">0</span></p>
    <p>Total Earnings: ₱<span id="total">0</span></p>
  </div>

  <!-- Rewards -->
  <div class="section">
    <h2>Eligibility</h2>
    <div class="eligibility">
      <div class="card"><h3>Reward ₱100</h3><p>Cost: 100 points</p><button id="reward100">Claim</button></div>
      <div class="card"><h3>Reward ₱200</h3><p>Cost: 200 points</p><button id="reward200">Claim</button></div>
      <div class="card"><h3>Reward ₱500</h3><p>Cost: 500 points</p><button id="reward500">Claim</button></div>
      <div class="card"><h3>Reward ₱1000</h3><p>Cost: 1000 points</p><button id="reward1000">Claim</button></div>
    </div>
  </div>

  <!-- Claim history -->
  <div class="section">
    <h2>Claim History</h2>
    <ul id="history"></ul>
  </div>

  <!-- Trimz series selector -->
  <div class="section">
    <h2>Watch Series</h2>
    <select id="seriesSelect">
      <option value="https://trimz.tv/99-reinforced-wooden-stick">Reinforced Wooden Stick</option>
      <option value="https://trimz.tv/the-gamer">The Gamer</option>
      <option value="https://trimz.tv/system-analyzer">System Analyzer</option>
      <option value="https://trimz.tv/life-exe">Life.exe</option>
      <option value="https://trimz.tv/slam-jam">Slam Jam</option>
      <option value="https://trimz.tv/guardians-of-rokia">Guardians of Rokia</option>
    </select>
    <button onclick="loadSeries()">Load</button>
    <div style="margin-top:20px;">
      <iframe id="seriesFrame" width="640" height="360" frameborder="0" allow="autoplay; fullscreen" allowfullscreen>
