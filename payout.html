<!DOCTYPE html>
<html>
<head>
  <title>Payout Settings</title>
  <style>
    body { font-family: Arial, sans-serif; background:#111; color:#fff; text-align:center; }
    .section { margin:20px; padding:20px; border-radius:10px; background:#222; }
    input, select, button { margin:10px; padding:8px; border-radius:5px; }
    button { background:#ff9800; border:none; cursor:pointer; }
  </style>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB6qQybRVw4nlwGA-Kp8d6kCqOhdqo11Aw",
      authDomain: "animegold-bf2a7.firebaseapp.com",
      projectId: "animegold-bf2a7",
      storageBucket: "animegold-bf2a7.firebasestorage.app",
      messagingSenderId: "1055086176557",
      appId: "1:1055086176557:web:57eace7825d9e7a069cba4",
      measurementId: "G-0QNF3XR7XH"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let userRef;

    onAuthStateChanged(auth, async (u) => {
      if (u) {
        userRef = doc(db, "users", u.uid);
        const snap = await getDoc(userRef);
        if (snap.exists()) {
          const data = snap.data();
          if (data.payoutMethod && data.payoutNumber) {
            document.getElementById("payoutDisplay").innerText =
              "Current: " + data.payoutMethod + " | " + data.payoutNumber;
          }
        }
      } else {
        window.location.href = "index.html";
      }
    });

    window.savePayoutInfo = async function() {
      const name = document.getElementById("fullName").value.trim();
      const method = document.getElementById("payoutMethod").value;
      const number = document.getElementById("payoutNumber").value.trim();

      if (!name || !method || !number) {
        alert("Please fill in all fields.");
        return;
      }

      try {
        await setDoc(userRef, {
          payoutName: name,
          payoutMethod: method,
          payoutNumber: number
        }, { merge: true });

        alert("Payout info saved!");
        document.getElementById("payoutDisplay").innerText =
          "Current: " + method + " | " + number;
      } catch (err) {
        console.error("Save failed:", err);
        alert("Error: " + err.message);
      }
    }
  </script>
</head>
<body>
  <h1>Payout Settings</h1>
  <div class="section">
    <p id="payoutDisplay" style="color:#0f0;">No payout info saved yet.</p>

    <input type="text" id="fullName" placeholder="Full Name" style="width:250px;"><br>
    <select id="payoutMethod" style="width:250px;">
      <option value="">Select Method</option>
      <option value="GCash">GCash</option>
      <option value="Maya">Maya</option>
    </select><br>
    <input type="text" id="payoutNumber" placeholder="GCash or Maya Number" style="width:250px;"><br>

    <button onclick="savePayoutInfo()">Save Payout Info</button><br><br>
    <button onclick="window.location.href='earn.html'">Back to Earn</button>
  </div>
</body>
</html>
